services:
  backend:
    build: ./backend
    container_name: windcast-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      DECISION_CUTOFF_LOCAL: "10:00"
      FORECAST_LOOKBACK_DAYS: "14"
  frontend:
    build: ./frontend
    container_name: windcast-web
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
